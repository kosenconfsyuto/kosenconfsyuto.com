        <script>
            function fadeIn(element, duration) {
                element.style.display = 'block';
                element.style.opacity = 0;
                let startTime = performance.now();

                function fade() {
                    let elapsed = performance.now() - startTime;
                    let progress = elapsed / duration;
                    if (progress < 1) {
                        element.style.opacity = progress;
                        requestAnimationFrame(fade);
                    } else {
                        element.style.opacity = 1;
                    }
                }

                requestAnimationFrame(fade);
            }

            function fadeOut(element, duration) {
                let startTime = performance.now();

                function fade() {
                    let elapsed = performance.now() - startTime;
                    let progress = elapsed / duration;
                    if (progress < 1) {
                        element.style.opacity = 1 - progress;
                        requestAnimationFrame(fade);
                    } else {
                        element.style.opacity = 0;
                        element.style.display = 'none';
                    }
                }

                requestAnimationFrame(fade);
            }

            function toggleMenu() {
                var menu = document.getElementById('menu');
                var openButton = document.querySelector('.hm-open-button');
                var closeButton = document.querySelector('.hm-close-button');

                if (menu.style.display === 'block' && menu.style.opacity == 1) {
                    fadeOut(menu, 300); // 300msでフェードアウト
                    openButton.style.display = 'block';
                    closeButton.style.display = 'none';
                } else {
                    fadeIn(menu, 300); // 300msでフェードイン
                    openButton.style.display = 'none';
                    closeButton.style.display = 'block';
                }
            }
        </script>
