<link rel="stylesheet" href="/css/article-cp.css">
<div id="article-cp">
    <div id="article-titles">
        <p>{{description}}</p>
        <h1>{{title}}</h1>
        <img src="{{image}}" alt="記事のOGP画像" class="w-full" loading="lazy">
    </div>
    <div id="article-content">
        {{contents}}
    </div>
    <div id="article-tags">
        <hr>
        <div class="flex">
            <img src="/icons/style_24dp_FILL0_wght200_GRAD0_opsz24.svg" alt="タグアイコン" loading="lazy">
            <h2 style="margin-bottom: 0;">この記事のタグ</h2>
        </div>
        {{tags}}
    </div>
</div>
