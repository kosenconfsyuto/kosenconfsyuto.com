[package]
name = "website"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
tera = "1.15"
actix-files = "0.6"
pulldown-cmark = "0.7"
env_logger = "0.9"
dotenv = "0.15"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde_json = "1.0"
chrono = "0.4"
urlencoding = "2.1"
openssl = "0.10"