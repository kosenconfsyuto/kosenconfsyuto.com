<link rel="stylesheet" href="/css/top.css">

<style>
    /* Custom styles for the slider */
    .swiper-container {
        width: 100%;
        height: 100%;
    }

    .swiper-slide {
        text-align: center;
        font-size: 18px;
        background: transparent;
        /* Center slide text vertically */
        display: -webkit-box;
        display: -ms-flexbox;
        display: -webkit-flex;
        display: flex;
        -webkit-box-pack: center;
        -ms-flex-pack: center;
        -webkit-justify-content: center;
        justify-content: center;
        -webkit-box-align: center;
        -ms-flex-align: center;
        -webkit-align-items: center;
        align-items: center;
    }
</style>
<div id="top-par">
    <div id="top-main-contents">
        <section id="top-flex" class="flex default-width">
            <div id="top-flex-left">
                <img src="/images/logo.png" alt="高専カンファレンス in 首都">
                <h2 class="text-3rem font-700">高専<wbr />カンファ<wbr />レンス</h2>
                <div class="flex space-between">
                    <h1 class="text-4rem font-700">in 首都</h1>
                    <div id="top-tpo-context">
                        <p>2025/3/16</p>
                        <p>豊島区民センター</p>
                    </div>
                </div>
                <h3 class="text-2rem"><span class="text-1-5rem">テーマ:</span>つながり</h3>
                <a href="https://eventapo.com/event/kosenconfsyuto" target="_blank" id="top-btn">申し込む</a>
            </div>
            <div id="top-flex-right">
                <div class="text-align-end">
                    <p>アクセスカウンター</p>
                    <span class="text-2rem font-700">{{access_count}}</span>
                </div>
            </div>
        </section>

        <div style="padding: 1rem; background: #fff; color: red; border-radius: 0.25rem; border: red 1px solid; font-weight: 600;" class="default-width">中止となりました。</div>
        <section id="important-news" class="default-width">
            <div>
                {{newslist}}
            </div>
        </section>
        <section id="slider">
            <div style="overflow: hidden;">
                <!-- Swiper -->
                <div class="swiper-container">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><a href="/news/release"><img src="/images/poster.png"
                                    class="w-full"></a></div>
                        <div class="swiper-slide"><img src="/images/member.png" class="w-full"></div>
                        <div class="swiper-slide"><a href="/news/narisumashi_twitter"><img src="/images/narisumashi.png"
                                    class="w-full"></a></div>
                        <div class="swiper-slide"><a href="/news/make_homepage"><img
                                    src="/images/tech-release-thumbnail.png" class="w-full"></a></div>
                        <div class="swiper-slide"><img src="/images/member.png" class="w-full"></div>
                    </div>
                    <div class="controls default-width"
                        style="position: unset; display: flex; justify-content: space-between; padding-top: 2em;">
                        <!-- Add pause/start -->
                        <div class="swiper-pause-par">
                            <button class="control swiper_pause">
                                <img src="/icons/pause_24dp_FILL1_wght200_GRAD0_opsz24.svg">
                            </button>
                            <button class="control swiper_start none">
                                <img src="/icons/play_arrow_24dp_FILL0_wght200_GRAD0_opsz24.svg">
                            </button>
                        </div>
                        <!-- Add Pagination -->
                        <div class="swiper-pagination"
                            style="position: relative; top: 0; bottom: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: center;">
                        </div>
                        <!-- Add Navigation -->
                        <div style="display: flex; gap: 1em; justify-content: flex-end;">
                            <div class="swiper-button-prev control"
                                style="position: relative; top: 0; width: fit-content; height: fit-content; margin-top: 0;">
                                <img src="/icons/chevron_right_24dp_FILL0_wght200_GRAD0_opsz24.svg"
                                    style="transform: rotate(180deg);" loading="lazy">
                            </div>
                            <div class="swiper-button-next control"
                                style="position: relative; top: 0; width: fit-content; height: fit-content; margin-top: 0;">
                                <img src="/icons/chevron_right_24dp_FILL0_wght200_GRAD0_opsz24.svg" loading="lazy">
                            </div>
                            <style>
                                .swiper-button-prev::after {
                                    content: "";
                                }

                                .swiper-button-next::after {
                                    content: "";
                                }
                            </style>
                        </div>

                    </div>
                </div>

                <!-- Swiper JS -->
                <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
                <!-- Initialize Swiper -->
                <script>
                    var swiper = new Swiper('.swiper-container', {
                        pagination: {
                            el: '.swiper-pagination',
                            clickable: true,
                        },
                        navigation: {
                            nextEl: '.swiper-button-next',
                            prevEl: '.swiper-button-prev',
                        },
                        loop: true,
                        autoHeight: false,
                        spaceBetween: 32,

                        slidesPerView: 1,
                        centeredSlides: true,
                        grabCursor: true,
                        slideToClickedSlide: true,
                        autoplay: {
                            delay: 5000,
                        },
                        breakpoints: {
                            985: {
                                slidesPerView: 1.5,
                            }
                        }
                    });

                    //一時停止
                    document.querySelector(".swiper_pause").addEventListener("click", function () {
                        swiper.autoplay.stop();
                        document.querySelector(".swiper_pause").classList.add("none");
                        document.querySelector(".swiper_start").classList.remove("none");
                    });
                    //再生
                    document.querySelector(".swiper_start").addEventListener("click", function () {
                        swiper.autoplay.start();
                        document.querySelector(".swiper_pause").classList.remove("none");
                        document.querySelector(".swiper_start").classList.add("none");
                    });
                </script>
            </div>
        </section>
        <section class="default-width" style="display: flex; flex-direction: column; gap: 1rem; text-align: center; align-items: center;">
            <div class="top-section-title">
                <h2>協賛募集</h2>
            </div>
            <p>高専カンファレンスin首都では、協賛を募集しています。ぜひご検討ください。</p>
            <a href="https://sponsor.kosenconfsyuto.com" target="_blank" id="top-btn" style="width: fit-content;">協賛する</a>
        </section>
        <section id="news" class="default-width">
            <div class="top-section-title">
                <h2>お知らせ</h2>
            </div>
            <div>
                {{newslist}}
            </div>
        </section>
        <section id="news">
            <div class="default-width top-section-title">
                <h2>会場</h2>
            </div>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d8151.722609311573!2d139.71343363630945!3d35.731477571180584!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188d0b9a3acc7d%3A0x53e14f9c487a874c!2sToshima%20Civic%20Center!5e0!3m2!1sen!2sjp!4v1736664293222!5m2!1sja!2sjp"
                class="map" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </section>
    </div>
    <div id="bg-follow-contents">
        <img src="/images/shibuya-shape.png" alt="首都のビル群" loading="lazy" class="d-brightness0-8">
    </div>
    <div id="bg-fixed-contents">
        <img src="/images/bg-object.svg" alt="背景オブジェクト" loading="lazy" class="d-brightness0-8">
    </div>
</div>
