---
title: お問い合わせ
description: お問い合わせページです。
tags: トップ
image: /images/site-ogp.png
common_parts: page | cn
---
<div id="contact">
    <form action="/submit_contact" method="post" id="contact_form">
        <div>
            <label for="name">お名前</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div>
            <label for="email">メールアドレス</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div>
            <label for="message">メッセージ</label>
            <textarea id="message" name="message" required></textarea>
        </div>
        <div>
            <p>すべての項目を入力してください。<br>
                また、お問い合わせ内容は、最大で1000文字まで、その他の項目は50文字までとなっております。ご注意ください。</p>
        </div>
        <button class="g-recaptcha" data-sitekey="reCAPTCHA_site_key" data-callback='onSubmit' data-action='submit'
            type="submit" value="">送信</button>
    </form>
    <script src="https://www.google.com/recaptcha/api.js?render=6LdrnwoqAAAAAEGPKdhjqDbyWC37HGEfzrwJy8R5"></script>
    <script>
    grecaptcha.ready(function() {
        grecaptcha.execute('6LdrnwoqAAAAAEGPKdhjqDbyWC37HGEfzrwJy8R5', {action: 'submit'}).then(function(token) {
            var recaptchaResponse = document.getElementById('recaptchaResponse');
            recaptchaResponse.value = token;
        });
    });
    </script>
</div>
